services:
  mongo:
    image: mongo:latest
    container_name: mongo
    ports:
      - "27017:27017"
    volumes:
      - ./data:/data/db
      - ./config:/etc/mongod.conf
    environment:
      - MONGO_INITDB_ROOT_USERNAME=promptHub
      - MONGO_INITDB_ROOT_PASSWORD=promptHub
      - MONGO_INITDB_DATABASE=promptHub
